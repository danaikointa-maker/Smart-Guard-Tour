<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลูกบ้าน — Smart Guard Tour</title>
<link rel="stylesheet" href="/common.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
</head>
<body>
<div class="container">
  <div id="scr-login">
    <h1>🏠 Smart Guard Tour — ลูกบ้าน</h1>
    <div class="card">
      <input id="lg-name" placeholder="ชื่อ (เช่น ลูกบ้าน A)" style="margin-bottom:10px;">
      <input id="lg-pin" type="password" inputmode="numeric" placeholder="PIN" style="margin-bottom:12px;">
      <button class="btn-primary" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>
    <p class="muted">เดโม่: ลูกบ้าน A / 1234</p>
  </div>

  <div id="scr-main" class="hidden">
    <h1>🛡️ สถานะการตรวจตรา</h1>
    <p class="muted" id="privacy-note"></p>
    <div id="rmap" class="hidden" style="height:260px;border-radius:14px;margin-bottom:14px;"></div>
    <div id="shift-cards"></div>
  </div>
</div>
<div id="toast"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/resident.js"></script>
</body>
</html>
