name: CI — tests

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run API test suite (spawns its own server on :3100)
        run: npm test

      - name: Syntax check server & public JS
        run: |
          node --check server/index.js
          node --check server/db.js
          node --check server/geo.js
          for f in public/*.js; do node --check "$f"; done
