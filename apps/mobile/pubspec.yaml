name: smart_guard_tour
description: Smart Guard Tour — แอป รปภ./ลูกบ้าน (Native, รองรับ Background GPS ตามนโยบาย Google Play)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                    # REST API
  web_socket_channel: ^3.0.1     # Realtime (WS) — ข้อมูลตำแหน่งเป็นของระบบเราเอง
  mobile_scanner: ^6.0.2          # สแกน QR
  geolocator: ^13.0.1             # GPS
  background_locator: ^0.0.2     # ติดตามตำแหน่งขณะล็อกจอ (Foreground Service บน Android)
  permission_handler: ^11.3.1     # ขอสิทธิ์ ACCESS_BACKGROUND_LOCATION ฯลฯ
  camera: ^0.11.0+2               # ถ่ายรูปจุดตรวจ
  flutter_map: ^7.0.2             # แผนที่แสดงผล (Google/OSM tiles ตามตั้งค่า)
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2      # คิวออฟไลน์ + token

flutter:
  uses-material-design: true
